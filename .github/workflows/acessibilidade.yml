name: Acessibilidade (WCAG 2.2 AA/AAA + AccessMonitor)

# Só corre quando é necessário: quando o site muda (push para main ou pull request)
# ou à mão, no separador Actions do GitHub ("Run workflow").
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'wcag-version.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: tests
        run: |
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Servir o site
        run: python3 -m http.server 8000 &
      - name: Testar acessibilidade
        working-directory: tests
        env:
          BASE_URL: http://localhost:8000/
        run: npm test
